<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lists and Tables</title>
</head>
<body>
    <ul>
    <li>Python</li>
    <li>JavaScript</li>
    <li>C++</li>
</ul>
<ol>
    <li>Plan the task</li>
    <li>Write the code
        <ul>
            <li>Open the editor</li>
            <li>Write the HTML</li>
        </ul>
    </li>
    <li>Test the code</li>
</ol>
<table>
    <caption>Weekly Study Timetable</caption>

    <thead>
        <tr>
            <th scope="col">Day</th>
            <th scope="col">Subject</th>
            <th scope="col">Hours</th>
        </tr>
    </thead>

    <tbody>
        <tr>
            <td>Sunday</td>
            <td>HTML</td>
            <td>2</td>
        </tr>

        <tr>
            <td>Monday</td>
            <td>Programming</td>
            <td>2</td>
        </tr>

        <tr>
            <td>Tuesday</td>
            <td>Networking</td>
            <td>2</td>
        </tr>
    </tbody>
</table>
</body>
</html>
